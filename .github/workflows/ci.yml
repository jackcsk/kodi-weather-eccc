name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover tests -v

  addon-check:
    # Team Kodi's linter for add-on submissions, run on exactly what the release zip contains.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install kodi-addon-checker
      - run: python tools/build_zip.py && mkdir -p build && unzip -q dist/*.zip -d build
      # matrix = Kodi 19, the oldest version addon.xml supports (xbmc.python 3.0.0)
      - run: kodi-addon-checker --branch matrix build/weather.environmentcanada

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, addon-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches addon.xml version
        run: |
          version=$(sed -n 's/.*<addon [^>]*version="\([^"]*\)".*/\1/p' weather.environmentcanada/addon.xml)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != addon.xml version $version"; exit 1; }
      - run: python3 tools/build_zip.py
      - run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
